server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: financeflow-account-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/financeflow_accounts}
    username: ${DATABASE_USERNAME:mayank}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  security:
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
